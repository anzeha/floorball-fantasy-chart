apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-domain
  namespace: {{.Values.global.namespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-domain
  template:
    metadata:
      labels:
        app: game-domain
    spec:
      containers:
        - name: game-domain
          image: "{{ .Values.image }}:{{ .Values.tag }}"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: "{{.Values.appName}}-app-config"
          env:
          - name: PG_USERNAME
            valueFrom:
              secretKeyRef:
                name: floorball-fantasy
                key: DB_USERNAME
          - name: PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: floorball-fantasy
                key: DB_PASSWORD
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: floorball-fantasy
                key: JWT_SECRET