apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{.Values.appName}}-app-config"
  namespace: {{.Values.global.namespace}}
data:
  PORT: "{{.Values.port}}"
  PG_HOST: {{.Values.pgHost}}
  PG_DATABASE: {{.Values.pgDatabase}}
  PG_PORT: "{{.Values.pgPort}}"
  USERS_SERVICE_URL: {{.Values.global.usersServiceUrl}}
