apiVersion: apps/v1
kind: Deployment
metadata:
  name: squads
  namespace: {{.Values.global.namespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: squads
  template:
    metadata:
      labels:
        app: squads
    spec:
      containers:
        - name: squads
          image: "{{ .Values.image }}:{{ .Values.tag }}"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: "{{.Values.appName}}-app-config"
          env:
          - name: CONNECTION_STRING
            valueFrom:
            secretKeyRef:
              name: floorball-fantasy
              key: SQUADS_CONNECTION_STRING
          - name: JWT_SECRET
            valueFrom:
            secretKeyRef:
              name: floorball-fantasy
              key: JWT_SECRET
